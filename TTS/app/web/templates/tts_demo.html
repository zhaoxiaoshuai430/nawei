<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nana TTS 测试</title>
  <link rel="stylesheet" href="/static/css/tts_demo.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>nana TTS 测试</h1>
      <p class="sub">独立 TTS 服务 · 京爷们 6 戏路 · <a href="/docs" target="_blank">API 文档</a></p>
    </header>

    <section class="card status-card">
      <div class="row">
        <span id="statusDot" class="dot off"></span>
        <span id="statusText">检查服务状态…</span>
      </div>
      <div class="meta" id="modelMeta"></div>
      <button type="button" id="reloadBtn" class="ghost" hidden>重新加载模型</button>
    </section>

    <section class="card">
      <label for="text">要合成的文字</label>
      <textarea id="text" rows="4" placeholder="输入中文，例如：哎呦喂，天哎，这票价也太离谱了吧。"></textarea>

      <label for="dramaSel">戏路（instruct）</label>
      <select id="dramaSel">
        <option value="">加载中…</option>
      </select>
      <p class="hint" id="dramaHint"></p>

      <div class="row actions">
        <button type="button" id="genBtn" disabled>生成语音</button>
        <span id="busy" class="busy" hidden>合成中…</span>
      </div>

      <audio id="player" controls hidden></audio>
      <p class="err" id="err" hidden></p>
    </section>
  </main>
  <script src="/static/js/tts_demo.js"></script>
</body>
</html>
