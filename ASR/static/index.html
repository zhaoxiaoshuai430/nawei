<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenseVoice ASR 测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .status {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 25px;
        }
        .status-idle { background: #e0e0e0; color: #666; }
        .status-recording { background: #fff3e0; color: #ef6c00; animation: pulse 1.5s infinite; }
        .status-processing { background: #e3f2fd; color: #1976d2; }
        .status-done { background: #e8f5e9; color: #2e7d32; }
        .status-error { background: #ffebee; color: #c62828; }
        .status-streaming { background: #f3e5f5; color: #7b1fa2; animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 108, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 108, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 108, 0, 0); }
        }
        .mode-toggle {
            display: flex;
            background: #f0f0f0;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .mode-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: #666;
            transition: all 0.3s;
        }
        .mode-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        button {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-record {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
        }
        .btn-record:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4); }
        .btn-stop {
            background: linear-gradient(135deg, #f44336, #da190b);
            color: white;
        }
        .btn-stop:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(244, 67, 54, 0.4); }
        .btn-reset {
            background: #9e9e9e;
            color: white;
        }
        .btn-reset:hover:not(:disabled) { transform: translateY(-2px); }
        .waveform {
            height: 80px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0 10px;
        }
        .wave-bar {
            width: 4px;
            background: linear-gradient(180deg, #667eea, #764ba2);
            border-radius: 2px;
            margin: 0 1px;
            height: 10px;
            transition: height 0.1s;
        }
        .result-area {
            min-height: 150px;
            padding: 20px;
            background: #fafafa;
            border-radius: 12px;
            border: 2px dashed #e0e0e0;
            font-size: 18px;
            line-height: 1.6;
            color: #333;
            overflow-y: auto;
            max-height: 300px;
        }
        .result-area.has-text { border-style: solid; border-color: #667eea; }
        .result-area.error { border-color: #f44336; color: #c62828; }
        .result-area.processing { color: #999; }
        .result-area.streaming { border-color: #9c27b0; border-style: solid; }
        .stream-badge {
            display: inline-block;
            padding: 2px 8px;
            background: #9c27b0;
            color: white;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .meta-info {
            margin-top: 15px;
            padding: 12px;
            background: #e3f2fd;
            border-radius: 8px;
            font-size: 13px;
            color: #1976d2;
            line-height: 1.8;
        }
        .config {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            padding: 15px;
            background: #fafafa;
            border-radius: 10px;
            flex-wrap: wrap;
        }
        .config label { font-weight: 600; color: #555; }
        .config select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.9);
            border-radius: 10px;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        .stream-stats {
            margin-top: 10px;
            padding: 10px;
            background: #f3e5f5;
            border-radius: 8px;
            font-size: 12px;
            color: #7b1fa2;
            display: flex;
            justify-content: space-around;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 SenseVoice ASR 测试</h1>
        
        <div class="card">
            <span id="status" class="status status-idle">准备就绪</span>
            
            <div class="mode-toggle">
                <button class="mode-btn active" onclick="setMode('full')" id="modeFull">📦 整段识别</button>
                <button class="mode-btn" onclick="setMode('stream')" id="modeStream">⚡ 增量识别</button>
            </div>
            
            <div class="config">
                <label>语言：</label>
                <select id="lang">
                    <option value="auto">自动检测</option>
                    <option value="zh">中文</option>
                    <option value="en">英语</option>
                    <option value="yue">粤语</option>
                    <option value="ja">日语</option>
                    <option value="ko">韩语</option>
                </select>
            </div>
            
            <div class="waveform" id="waveform">
                <div style="color: #999;">等待录音...</div>
            </div>
            
            <div class="controls">
                <button id="btnRecord" class="btn-record" onclick="startRecording()">🎙️ 录音</button>
                <button id="btnStop" class="btn-stop" onclick="stopRecording()" disabled>⏹️ 停止</button>
                <button id="btnReset" class="btn-reset" onclick="reset()" disabled>🗑️ 重置</button>
            </div>
            
            <div class="result-area" id="result">点击"录音"按钮，对着麦克风说话</div>
            <div class="stream-stats" id="streamStats" style="display: none;">
                <span>📊 已发送: <b id="chunkCount">0</b> 次</span>
                <span>📝 识别次数: <b id="recognizeCount">0</b></span>
            </div>
            <div class="meta-info" id="meta" style="display: none;"></div>
            
            <div class="info">
                💡 提示：选择"增量识别"模式可以边说边识别，获得实时结果。请确保后端服务已启动（端口 8001）。
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder = null;
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let animationId = null;
        let isRecording = false;
        let currentMode = 'full';

        let audioChunks = [];
        let allAudioChunks = [];
        let streamInterval = null;
        let chunkCount = 0;
        let recognizeCount = 0;
        let isRecognizing = false;

        const API_URL = 'http://localhost:8001/api/v1/asr';

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeFull').classList.toggle('active', mode === 'full');
            document.getElementById('modeStream').classList.toggle('active', mode === 'stream');
            document.getElementById('streamStats').style.display = mode === 'stream' ? 'flex' : 'none';
            reset();
        }

        function updateStatus(status) {
            const el = document.getElementById('status');
            el.className = 'status status-' + status;
            const texts = {
                idle: '准备就绪',
                recording: '录音中...',
                streaming: '增量识别中...',
                processing: '识别中...',
                done: '识别完成',
                error: '错误'
            };
            el.textContent = texts[status];
        }

        function updateButtons(recording, processed) {
            document.getElementById('btnRecord').disabled = recording;
            document.getElementById('btnStop').disabled = !recording;
            document.getElementById('btnReset').disabled = !processed;
        }

        function createWaveform() {
            const waveform = document.getElementById('waveform');
            waveform.innerHTML = '';
            for (let i = 0; i < 80; i++) {
                const bar = document.createElement('div');
                bar.className = 'wave-bar';
                waveform.appendChild(bar);
            }
            return Array.from(waveform.children);
        }

        let waveBars = null;

        async function startRecording() {
            const resultEl = document.getElementById('result');
            
            if (!window.isSecureContext) {
                updateStatus('error');
                resultEl.className = 'result-area error';
                resultEl.innerHTML = `
                    <strong>❌ 安全上下文错误</strong><br><br>
                    浏览器要求在安全上下文（HTTPS 或 localhost）中才能访问麦克风。<br>
                    当前地址: <code>${window.location.href}</code><br><br>
                    <strong>解决方案：</strong><br>
                    请使用 <code>http://localhost:8001/</code> 或 <code>http://127.0.0.1:8001/</code> 访问页面。
                `;
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                updateStatus('error');
                resultEl.className = 'result-area error';
                resultEl.innerHTML = `
                    <strong>❌ 浏览器不支持</strong><br><br>
                    当前浏览器不支持 WebRTC 录音功能。<br>
                    请使用 Chrome、Edge、Firefox 或 Safari 浏览器。
                `;
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        sampleRate: 16000, 
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true
                    } 
                });

                audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                waveBars = createWaveform();

                audioChunks = [];
                allAudioChunks = [];
                chunkCount = 0;
                recognizeCount = 0;
                isRecognizing = false;
                document.getElementById('chunkCount').textContent = '0';
                document.getElementById('recognizeCount').textContent = '0';

                const supportedMimeTypes = [
                    'audio/webm;codecs=opus',
                    'audio/webm',
                    'audio/ogg;codecs=opus',
                    'audio/ogg'
                ];
                
                let mimeType = '';
                for (const type of supportedMimeTypes) {
                    if (MediaRecorder.isTypeSupported(type)) {
                        mimeType = type;
                        break;
                    }
                }
                
                mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                        allAudioChunks.push(event.data);
                    }
                };

                mediaRecorder.start(100);

                isRecording = true;
                updateVisualizer();

                if (currentMode === 'stream') {
                    resultEl.className = 'result-area streaming';
                    resultEl.innerHTML = '<span class="stream-badge">⚡ 增量识别</span><div id="streamText">正在等待语音输入...</div>';
                    updateStatus('streaming');

                    streamInterval = setInterval(() => {
                        if (!isRecording) return;
                        performIncrementalRecognition();
                    }, 1500);
                } else {
                    updateStatus('recording');
                }

                updateButtons(true, false);

            } catch (err) {
                console.error('录音启动失败:', err);
                updateStatus('error');
                resultEl.className = 'result-area error';
                
                let message = '';
                if (err.name === 'NotAllowedError') {
                    message = `
                        <strong>❌ 权限被拒绝</strong><br><br>
                        您拒绝了麦克风访问权限。<br><br>
                        <strong>解决方案：</strong><br>
                        1. 点击浏览器地址栏左侧的 🔒 图标<br>
                        2. 在"麦克风"选项中选择"允许"<br>
                        3. 刷新页面后重试
                    `;
                } else if (err.name === 'NotFoundError') {
                    message = `
                        <strong>❌ 未找到麦克风</strong><br><br>
                        系统中未检测到麦克风设备。<br><br>
                        <strong>解决方案：</strong><br>
                        1. 检查麦克风是否已连接<br>
                        2. 在系统设置中确认麦克风已启用<br>
                        3. 关闭其他占用麦克风的程序
                    `;
                } else if (err.name === 'NotReadableError') {
                    message = `
                        <strong>❌ 麦克风被占用</strong><br><br>
                        麦克风正在被其他程序使用。<br><br>
                        <strong>解决方案：</strong><br>
                        关闭所有正在使用麦克风的程序（如微信、QQ、视频会议等），然后重试。
                    `;
                } else {
                    message = `
                        <strong>❌ 无法访问麦克风</strong><br><br>
                        错误: ${err.name}<br>
                        详情: ${err.message}
                    `;
                }
                
                resultEl.innerHTML = message;
            }
        }

        async function performIncrementalRecognition() {
            if (isRecognizing || allAudioChunks.length === 0) return;
            
            isRecognizing = true;
            chunkCount++;
            document.getElementById('chunkCount').textContent = chunkCount;
            
            try {
                const audioBlob = new Blob(allAudioChunks, { type: 'audio/webm' });
                
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                
                await new Promise((resolve, reject) => {
                    reader.onload = resolve;
                    reader.onerror = reject;
                });
                
                const base64Data = reader.result.split(',')[1];
                
                const lang = document.getElementById('lang').value;
                
                const response = await fetch(API_URL + '/base64', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        audio_base64: base64Data,
                        filename: 'stream.webm',
                        lang: lang,
                        use_itn: true
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`请求失败 (${response.status})`);
                }
                
                const data = await response.json();
                
                if (data.result && data.result.length > 0) {
                    const result = data.result[0];
                    const text = result.text || '';
                    
                    if (text && text.trim()) {
                        recognizeCount++;
                        document.getElementById('recognizeCount').textContent = recognizeCount;
                        
                        const streamText = document.getElementById('streamText');
                        if (streamText) {
                            streamText.textContent = text;
                        }
                        
                        const metaEl = document.getElementById('meta');
                        metaEl.style.display = 'block';
                        let metaHtml = `<strong>语言:</strong> ${result.language || '未知'}`;
                        if (result.emotion) {
                            metaHtml += ` | <strong>情绪:</strong> ${result.emotion || ''} ${result.emotion_emoji || ''}`;
                        }
                        if (result.emotion_label) {
                            metaHtml += ` (${result.emotion_label})`;
                        }
                        metaEl.innerHTML = metaHtml;
                    }
                }
            } catch (err) {
                console.error('增量识别错误:', err);
            } finally {
                isRecognizing = false;
            }
        }

        function updateVisualizer() {
            if (!isRecording || !analyser) return;

            analyser.getByteFrequencyData(dataArray);
            
            const bars = waveBars || Array.from(document.querySelectorAll('.wave-bar'));
            const step = Math.floor(dataArray.length / bars.length);
            
            for (let i = 0; i < bars.length; i++) {
                const value = dataArray[i * step];
                const height = Math.max(10, (value / 255) * 100);
                bars[i].style.height = height + '%';
            }

            animationId = requestAnimationFrame(updateVisualizer);
        }

        function stopRecording() {
            if (!isRecording) return;

            isRecording = false;
            
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }

            if (streamInterval) {
                clearInterval(streamInterval);
                streamInterval = null;
            }

            if (mediaRecorder) {
                mediaRecorder.stop();
            }

            if (audioContext) {
                setTimeout(() => {
                    audioContext.close();
                    audioContext = null;
                }, 500);
            }

            if (mediaRecorder && mediaRecorder.stream) {
                const stream = mediaRecorder.stream;
                stream.getTracks().forEach(track => track.stop());
            }

            if (currentMode === 'stream') {
                if (allAudioChunks.length > 0) {
                    performIncrementalRecognition();
                }
                updateStatus('done');
            } else {
                updateStatus('processing');
                setTimeout(() => processAudio(), 500);
            }

            updateButtons(false, true);
        }

        async function processAudio() {
            if (allAudioChunks.length === 0) {
                updateStatus('idle');
                return;
            }
            
            const audioBlob = new Blob(allAudioChunks, { type: 'audio/webm' });
            
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            
            const resultEl = document.getElementById('result');
            const metaEl = document.getElementById('meta');

            resultEl.className = 'result-area processing';
            resultEl.textContent = '正在识别...';
            metaEl.style.display = 'none';

            try {
                await new Promise((resolve, reject) => {
                    reader.onload = resolve;
                    reader.onerror = reject;
                });
                
                const base64Data = reader.result.split(',')[1];
                const lang = document.getElementById('lang').value;
                
                const response = await fetch(API_URL + '/base64', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        audio_base64: base64Data,
                        filename: 'recording.webm',
                        lang: lang,
                        use_itn: true
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`请求失败 (${response.status}): ${errorText}`);
                }

                const data = await response.json();

                if (data.result && data.result.length > 0) {
                    const result = data.result[0];
                    resultEl.className = 'result-area has-text';
                    resultEl.textContent = result.text || '未识别到语音';
                    
                    metaEl.style.display = 'block';
                    let metaHtml = `<strong>语言:</strong> ${result.language || '未知'}`;
                    if (result.emotion) {
                        metaHtml += ` | <strong>情绪:</strong> ${result.emotion || ''} ${result.emotion_emoji || ''}`;
                    }
                    if (result.emotion_label) {
                        metaHtml += ` (${result.emotion_label})`;
                    }
                    if (result.emotion_hint) {
                        metaHtml += `<br><strong>情绪提示:</strong> ${result.emotion_hint}`;
                    }
                    metaEl.innerHTML = metaHtml;
                    updateStatus('done');
                } else {
                    resultEl.className = 'result-area';
                    resultEl.textContent = '未识别到结果';
                    updateStatus('idle');
                }

            } catch (err) {
                console.error('识别失败:', err);
                resultEl.className = 'result-area error';
                resultEl.textContent = '识别失败: ' + err.message;
                updateStatus('error');
            }

            updateButtons(false, true);
        }

        function reset() {
            const resultEl = document.getElementById('result');
            const metaEl = document.getElementById('meta');
            const waveform = document.getElementById('waveform');

            resultEl.className = 'result-area';
            resultEl.textContent = '点击"录音"按钮，对着麦克风说话';
            metaEl.style.display = 'none';
            waveform.innerHTML = '<div style="color: #999;">等待录音...</div>';
            document.getElementById('chunkCount').textContent = '0';
            document.getElementById('recognizeCount').textContent = '0';
            chunkCount = 0;
            recognizeCount = 0;
            audioChunks = [];
            allAudioChunks = [];
            isRecognizing = false;
            if (streamInterval) {
                clearInterval(streamInterval);
                streamInterval = null;
            }
            updateStatus('idle');
            updateButtons(false, false);
        }
    </script>
</body>
</html>
