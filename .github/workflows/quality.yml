name: quality

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            deploy/requirements-app.txt
            deploy/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r deploy/requirements-app.txt -r deploy/requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app_protocols services deploy/scripts tests
      - name: Lint fatal errors
        run: python -m ruff check app_protocols services deploy/scripts tests
      - name: Type-check application services
        run: python -m mypy app_protocols services/gateway services/llm --ignore-missing-imports
      - name: Type-check supporting services
        run: >-
          python -m mypy services/knowledge services/asr/src services/asr/sensevoice_runtime
          deploy/scripts --ignore-missing-imports --follow-imports=skip
      - name: Run tests
        run: python -m pytest -q
      - name: Run ASR and TTS boundary tests
        run: python -m pytest -q services/asr/tests services/tts/tests
      - name: Scan tracked files for private keys
        run: |
          if git grep -n -I -E 'sk-[A-Za-z0-9_-]{16,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- ':!*.md' ':!*.example'; then
            exit 1
          fi
      - name: Validate production Compose
        run: |
          NAWEI_ENV_FILE=.env.production.example \
            docker compose \
              --env-file deploy/.env.production.example \
              -f deploy/docker-compose.production.yml \
              config --quiet
      - name: Validate infrastructure Compose
        run: docker compose -f deploy/docker-compose.llm-infra.yml config --quiet
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $paths = @(
            "scripts/start_project.ps1",
            "scripts/stop_project.ps1",
            "scripts/status_project.ps1",
            "scripts/check_project.ps1",
            "scripts/project_runtime.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$path has PowerShell syntax errors: $(($errors.Message) -join '; ')"
            }
          }
