name: nawei-production

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app-service: &app-service
  image: nawei/app:${NAWEI_IMAGE_TAG:-latest}
  build:
    context: ..
    dockerfile: deploy/Dockerfile.app
  env_file:
    - ${NAWEI_ENV_FILE:-.env.production}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  logging: *json-logging
  networks:
    - backend

services:
  config-check:
    <<: *app-service
    command: ["python", "/app/deploy/scripts/validate_production_env.py"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nawei}
      POSTGRES_USER: ${POSTGRES_USER:-nawei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nawei} -d ${POSTGRES_DB:-nawei}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *json-logging
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *json-logging
    networks:
      - backend

  llm:
    <<: *app-service
    command: ["python", "-m", "services.llm.run"]
    environment:
      LLM_INTERNAL_API_KEY: ${LLM_INTERNAL_API_KEY:?Set LLM_INTERNAL_API_KEY}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nawei}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nawei}
      REDIS_URL: redis://redis:6379/0
      MEMORY_ENABLED: "true"
      LLM_MEMORY_REQUIRED: "true"
    depends_on:
      config-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/.runtime-tools:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
      - egress
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  asr:
    image: nawei/asr:${NAWEI_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.asr
    env_file:
      - ${NAWEI_ENV_FILE:-.env.production}
    environment:
      ASR_INTERNAL_API_KEY: ${ASR_INTERNAL_API_KEY:?Set ASR_INTERNAL_API_KEY}
    depends_on:
      config-check:
        condition: service_completed_successfully
    volumes:
      - asr_models:/app/services/asr/hf_download
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 300s
    logging: *json-logging
    networks:
      - backend
      - egress
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 12G

  tts:
    image: nawei/tts:${NAWEI_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tts
    env_file:
      - ${NAWEI_ENV_FILE:-.env.production}
    environment:
      TTS_INTERNAL_API_KEY: ${TTS_INTERNAL_API_KEY:?Set TTS_INTERNAL_API_KEY}
      NAWEI_MODEL_ROOT: /app/models
    depends_on:
      config-check:
        condition: service_completed_successfully
    volumes:
      - tts_data:/app/services/tts/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19000/api/v1/status', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s
    logging: *json-logging
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 24G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gateway:
    <<: *app-service
    command: ["python", "-m", "services.gateway.run"]
    environment:
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:?Set GATEWAY_JWT_SECRET}
      ASR_INTERNAL_API_KEY: ${ASR_INTERNAL_API_KEY:?Set ASR_INTERNAL_API_KEY}
      LLM_INTERNAL_API_KEY: ${LLM_INTERNAL_API_KEY:?Set LLM_INTERNAL_API_KEY}
      TTS_INTERNAL_API_KEY: ${TTS_INTERNAL_API_KEY:?Set TTS_INTERNAL_API_KEY}
    depends_on:
      config-check:
        condition: service_completed_successfully
      asr:
        condition: service_healthy
      llm:
        condition: service_healthy
      tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - edge
      - backend
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

  caddy:
    image: caddy:2-alpine
    env_file:
      - ${NAWEI_ENV_FILE:-.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run:size=16m,mode=755
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *json-logging
    networks:
      - edge
      - egress

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    profiles: ["observability"]
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging: *json-logging
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - blackbox-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *json-logging
    networks:
      - backend

networks:
  edge:
    internal: true
  backend:
    internal: true
  egress:

volumes:
  asr_models:
  tts_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  prometheus_data:
