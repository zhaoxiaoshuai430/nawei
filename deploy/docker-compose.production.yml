name: nawei-production

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app-service: &app-service
  image: nawei/app:${NAWEI_IMAGE_TAG:-latest}
  build:
    context: ..
    dockerfile: deploy/Dockerfile.app
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  logging: *json-logging
  networks:
    - backend

services:
  config-check:
    <<: *app-service
    env_file:
      - ${NAWEI_ENV_FILE:-.env.production}
    command: ["python", "/app/deploy/scripts/validate_production_env.py"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nawei}
      POSTGRES_USER: ${POSTGRES_USER:-nawei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nawei} -d ${POSTGRES_DB:-nawei}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *json-logging
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *json-logging
    networks:
      - backend

  qdrant:
    image: ${QDRANT_IMAGE:?Set QDRANT_IMAGE}
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *json-logging
    networks:
      - backend

  neo4j:
    image: ${NEO4J_IMAGE:?Set NEO4J_IMAGE}
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p '${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}' 'RETURN 1'"]
      interval: 5s
      timeout: 8s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *json-logging
    networks:
      - backend

  knowledge:
    <<: *app-service
    command: ["python", "-m", "services.knowledge.run"]
    environment:
      NAWEI_ENV: production
      KNOWLEDGE_HOST: 0.0.0.0
      KNOWLEDGE_PORT: 8003
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-true}
      KNOWLEDGE_REQUIRED: ${KNOWLEDGE_REQUIRED:-true}
      KNOWLEDGE_INTERNAL_API_KEY: ${KNOWLEDGE_INTERNAL_API_KEY:?Set KNOWLEDGE_INTERNAL_API_KEY}
      KNOWLEDGE_ADMIN_API_KEY: ${KNOWLEDGE_ADMIN_API_KEY:?Set KNOWLEDGE_ADMIN_API_KEY}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-knowledge_chunks_v1}
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:?Set EMBEDDING_PROVIDER}
      EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL:?Set EMBEDDING_API_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?Set EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?Set EMBEDDING_MODEL}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:?Set EMBEDDING_DIMENSION}
      KNOWLEDGE_GRAPH_EXTRACTOR: ${KNOWLEDGE_GRAPH_EXTRACTOR:-llm}
      KNOWLEDGE_LLM_EXTRACTOR_URL: http://llm:8002/api/v1/llm
      LLM_INTERNAL_API_KEY: ${LLM_INTERNAL_API_KEY:?Set LLM_INTERNAL_API_KEY}
      KNOWLEDGE_CHUNK_SIZE: ${KNOWLEDGE_CHUNK_SIZE:-600}
      KNOWLEDGE_CHUNK_OVERLAP: ${KNOWLEDGE_CHUNK_OVERLAP:-100}
      KNOWLEDGE_CACHE_TTL_SECONDS: ${KNOWLEDGE_CACHE_TTL_SECONDS:-600}
      KNOWLEDGE_MAX_CONTEXT_CHARS: ${KNOWLEDGE_MAX_CONTEXT_CHARS:-6000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nawei}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nawei}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      config-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
      - egress
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  llm:
    <<: *app-service
    command: ["python", "-m", "services.llm.run"]
    environment:
      NAWEI_ENV: production
      LLM_INTERNAL_API_KEY: ${LLM_INTERNAL_API_KEY:?Set LLM_INTERNAL_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-pro}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-25}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-true}
      LLM_FALLBACK_TEXT: ${LLM_FALLBACK_TEXT:-}
      LLM_THINKING_ENABLED: ${LLM_THINKING_ENABLED:-false}
      LLM_AGENT_ENABLED: ${LLM_AGENT_ENABLED:-true}
      LLM_AGENT_MODE: ${LLM_AGENT_MODE:-langgraph}
      LLM_TOOL_AGENT_MODE: ${LLM_TOOL_AGENT_MODE:-langgraph}
      LLM_TOOL_TIMEOUT_SECONDS: ${LLM_TOOL_TIMEOUT_SECONDS:-6}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      LLM_MEMORY_REQUIRED: ${LLM_MEMORY_REQUIRED:-true}
      MEMORY_EXTRACTOR_ENABLED: ${MEMORY_EXTRACTOR_ENABLED:-true}
      MEMORY_EXTRACTOR_URL: ${MEMORY_EXTRACTOR_URL:-http://llm:8002/api/v1/llm}
      MEMORY_PROFILE_REDIS_CACHE: ${MEMORY_PROFILE_REDIS_CACHE:-true}
      TIME_TOOL_ENABLED: ${TIME_TOOL_ENABLED:-true}
      CALCULATOR_TOOL_ENABLED: ${CALCULATOR_TOOL_ENABLED:-true}
      UNIT_TOOL_ENABLED: ${UNIT_TOOL_ENABLED:-true}
      DICTIONARY_TOOL_ENABLED: ${DICTIONARY_TOOL_ENABLED:-true}
      ENCYCLOPEDIA_TOOL_ENABLED: ${ENCYCLOPEDIA_TOOL_ENABLED:-true}
      WEATHER_TOOL_ENABLED: ${WEATHER_TOOL_ENABLED:-true}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open_meteo}
      BOCHA_WEB_SEARCH_ENABLED: ${BOCHA_WEB_SEARCH_ENABLED:-false}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nawei}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nawei}
      REDIS_URL: redis://redis:6379/0
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-true}
      KNOWLEDGE_REQUIRED: ${KNOWLEDGE_REQUIRED:-true}
      KNOWLEDGE_INTERNAL_API_KEY: ${KNOWLEDGE_INTERNAL_API_KEY:?Set KNOWLEDGE_INTERNAL_API_KEY}
      KNOWLEDGE_RETRIEVE_URL: http://knowledge:8003/api/v1/knowledge/retrieve
      KNOWLEDGE_HEALTH_URL: http://knowledge:8003/health
      KNOWLEDGE_DEFAULT_BASE_ID: ${KNOWLEDGE_DEFAULT_BASE_ID:-default}
      KNOWLEDGE_TIMEOUT_SECONDS: ${KNOWLEDGE_TIMEOUT_SECONDS:-8}
    depends_on:
      config-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      knowledge:
        condition: service_healthy
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/.runtime-tools:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
      - egress
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  asr:
    image: nawei/asr:${NAWEI_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.asr
    environment:
      NAWEI_ENV: production
      ASR_INTERNAL_API_KEY: ${ASR_INTERNAL_API_KEY:?Set ASR_INTERNAL_API_KEY}
      ASR_DEVICE: ${ASR_DEVICE:-cuda:0}
      ASR_MAX_CONCURRENT_INFERENCES: ${ASR_MAX_CONCURRENT_INFERENCES:-1}
      ASR_MAX_QUEUE_SIZE: ${ASR_MAX_QUEUE_SIZE:-16}
      ASR_QUEUE_TIMEOUT_SECONDS: ${ASR_QUEUE_TIMEOUT_SECONDS:-30}
      ASR_MAX_AUDIO_BYTES: ${ASR_MAX_AUDIO_BYTES:-26214400}
      ASR_MAX_AUDIO_FILES: ${ASR_MAX_AUDIO_FILES:-4}
      ASR_REALTIME_END_SILENCE_MS: ${ASR_REALTIME_END_SILENCE_MS:-420}
      ASR_REALTIME_MAX_SESSION_SECONDS: ${ASR_REALTIME_MAX_SESSION_SECONDS:-3600}
    depends_on:
      config-check:
        condition: service_completed_successfully
    volumes:
      - asr_models:/app/services/asr/hf_download
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 300s
    logging: *json-logging
    networks:
      - backend
      - egress
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 12G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tts:
    image: nawei/tts:${NAWEI_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tts
    environment:
      NAWEI_ENV: production
      TTS_INTERNAL_API_KEY: ${TTS_INTERNAL_API_KEY:?Set TTS_INTERNAL_API_KEY}
      TTS_ADMIN_API_KEY: ${TTS_ADMIN_API_KEY:?Set TTS_ADMIN_API_KEY}
      NAWEI_MODEL_ROOT: /app/models
      VOICE_LAB_SPEAKER: ${VOICE_LAB_SPEAKER:-liliya}
      TTS_MAX_QUEUE_SIZE: ${TTS_MAX_QUEUE_SIZE:-8}
      TTS_QUEUE_TIMEOUT_SECONDS: ${TTS_QUEUE_TIMEOUT_SECONDS:-120}
      TTS_STREAM_QUEUE_SIZE: ${TTS_STREAM_QUEUE_SIZE:-8}
      TTS_STREAM_QUEUE_PUT_TIMEOUT_SECONDS: ${TTS_STREAM_QUEUE_PUT_TIMEOUT_SECONDS:-5}
    depends_on:
      config-check:
        condition: service_completed_successfully
    volumes:
      - tts_data:/app/services/tts/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19000/api/v1/status', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s
    logging: *json-logging
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 24G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gateway:
    <<: *app-service
    command: ["python", "-m", "services.gateway.run"]
    environment:
      NAWEI_ENV: production
      GATEWAY_AUTH_MODE: jwt
      GATEWAY_ENABLE_DIAGNOSTICS: "false"
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:?Set GATEWAY_JWT_SECRET}
      GATEWAY_JWT_ISSUER: ${GATEWAY_JWT_ISSUER:-nawei-auth}
      GATEWAY_JWT_AUDIENCE: ${GATEWAY_JWT_AUDIENCE:-nawei-gateway}
      ASR_INTERNAL_API_KEY: ${ASR_INTERNAL_API_KEY:?Set ASR_INTERNAL_API_KEY}
      LLM_INTERNAL_API_KEY: ${LLM_INTERNAL_API_KEY:?Set LLM_INTERNAL_API_KEY}
      TTS_INTERNAL_API_KEY: ${TTS_INTERNAL_API_KEY:?Set TTS_INTERNAL_API_KEY}
      GATEWAY_ASR_URL: ${GATEWAY_ASR_URL:-http://asr:8001/api/v1/audio/transcriptions/base64}
      GATEWAY_ASR_REALTIME_URL: ${GATEWAY_ASR_REALTIME_URL:-ws://asr:8001/api/v1/asr/realtime}
      GATEWAY_LLM_URL: ${GATEWAY_LLM_URL:-http://llm:8002/api/v1/llm}
      GATEWAY_LLM_STREAM_URL: ${GATEWAY_LLM_STREAM_URL:-http://llm:8002/api/v1/llm/stream}
      GATEWAY_TTS_URL: ${GATEWAY_TTS_URL:-http://tts:19000/api/v1/audio/speech}
      GATEWAY_TTS_STREAM_URL: ${GATEWAY_TTS_STREAM_URL:-http://tts:19000/api/v1/audio/speech/stream}
      GATEWAY_ASR_HEALTH_URL: ${GATEWAY_ASR_HEALTH_URL:-http://asr:8001/health}
      GATEWAY_LLM_HEALTH_URL: ${GATEWAY_LLM_HEALTH_URL:-http://llm:8002/health}
      GATEWAY_TTS_HEALTH_URL: ${GATEWAY_TTS_HEALTH_URL:-http://tts:19000/api/v1/status}
      GATEWAY_ASR_TIMEOUT_SECONDS: ${GATEWAY_ASR_TIMEOUT_SECONDS:-300}
      GATEWAY_LLM_TIMEOUT_SECONDS: ${GATEWAY_LLM_TIMEOUT_SECONDS:-60}
      GATEWAY_TTS_TIMEOUT_SECONDS: ${GATEWAY_TTS_TIMEOUT_SECONDS:-300}
      GATEWAY_HEALTH_TIMEOUT_SECONDS: ${GATEWAY_HEALTH_TIMEOUT_SECONDS:-3}
      GATEWAY_MAX_CONCURRENT_REQUESTS: ${GATEWAY_MAX_CONCURRENT_REQUESTS:-20}
      GATEWAY_MAX_CONCURRENT_REQUESTS_PER_USER: ${GATEWAY_MAX_CONCURRENT_REQUESTS_PER_USER:-2}
      GATEWAY_MAX_QUEUED_REQUESTS: ${GATEWAY_MAX_QUEUED_REQUESTS:-100}
      GATEWAY_MAX_QUEUED_REQUESTS_PER_USER: ${GATEWAY_MAX_QUEUED_REQUESTS_PER_USER:-4}
      GATEWAY_CONCURRENCY_WAIT_TIMEOUT_SECONDS: ${GATEWAY_CONCURRENCY_WAIT_TIMEOUT_SECONDS:-10}
      GATEWAY_REALTIME_START_TIMEOUT_SECONDS: ${GATEWAY_REALTIME_START_TIMEOUT_SECONDS:-10}
      GATEWAY_VOICE_TTS_SEGMENT_QUEUE_SIZE: ${GATEWAY_VOICE_TTS_SEGMENT_QUEUE_SIZE:-8}
      GATEWAY_TTS_SOFT_SEGMENT_MIN_CHARS: ${GATEWAY_TTS_SOFT_SEGMENT_MIN_CHARS:-8}
      GATEWAY_TTS_FIRST_SEGMENT_CHARS: ${GATEWAY_TTS_FIRST_SEGMENT_CHARS:-6}
      GATEWAY_TTS_EAGER_SEGMENT_CHARS: ${GATEWAY_TTS_EAGER_SEGMENT_CHARS:-48}
      GATEWAY_TTS_STREAM_CHUNK_SIZE: ${GATEWAY_TTS_STREAM_CHUNK_SIZE:-8}
    depends_on:
      config-check:
        condition: service_completed_successfully
      asr:
        condition: service_healthy
      llm:
        condition: service_healthy
      tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - edge
      - backend
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

  caddy:
    image: caddy:2-alpine
    environment:
      NAWEI_DOMAIN: ${NAWEI_DOMAIN:?Set NAWEI_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run:size=16m,mode=755
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *json-logging
    networks:
      - edge
      - egress

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    profiles: ["observability"]
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging: *json-logging
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - blackbox-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *json-logging
    networks:
      - backend

networks:
  edge:
    internal: true
  backend:
    internal: true
  egress:

volumes:
  asr_models:
  tts_data:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  caddy_data:
  caddy_config:
  prometheus_data:
