[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "services/asr/.venv",
    "services/tts/cuda_env",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"services/asr/src/main.py" = ["E402"]
"services/tts/app/services/tts/server.py" = ["E402"]
