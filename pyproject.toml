[tool.pytest.ini_options]
testpaths = ["tests", "services/gateway/tests", "services/llm/tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
exclude = ["data", "tests"]

[[tool.mypy.overrides]]
module = ["app_protocols.base", "services.llm.main"]
disable_error_code = ["misc", "assignment"]

[[tool.mypy.overrides]]
module = ["services.llm.agents.runtime_tool_agent", "services.llm.agents.tutor_graph"]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = ["services.llm.tools.weather"]
disable_error_code = ["dict-item", "arg-type", "type-var"]

[[tool.mypy.overrides]]
module = ["services.llm.memory"]
disable_error_code = ["dict-item", "union-attr", "arg-type"]

[[tool.mypy.overrides]]
module = ["services.llm.skills.manager"]
disable_error_code = ["union-attr"]
