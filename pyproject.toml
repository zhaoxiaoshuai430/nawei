[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "services/asr/.venv",
    "services/tts/cuda_env",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"services/asr/src/main.py" = ["E402"]
"services/tts/app/services/tts/server.py" = ["E402"]
# Standalone CLIs must establish their project/dependency path before local imports.
"scripts/check_aliyun_content_safety.py" = ["E402"]
"scripts/check_full_flow.py" = ["E402"]
"scripts/check_native_streaming.py" = ["E402"]
"scripts/check_robot_concurrency.py" = ["E402"]
"scripts/evaluate_semantic_pipeline.py" = ["E402"]
"scripts/import_structured_knowledge.py" = ["E402"]
"scripts/reindex_semantic.py" = ["E402"]
"scripts/run_light_health_comparison.py" = ["E402"]
"scripts/warm_voice.py" = ["E402"]
# Preserve dotenv initialization before importing the publishing SDKs.
"firmware/xiaozhi-esp32/scripts/versions.py" = ["E402"]
